spring.application.name=relay-backend
server.port=8080

app.public-base-url=https://runtracer.com
app.camera.resolve-ttl-seconds=60
app.camera.default-timeout-ms=5000
app.camera.registry[0].id=cam-1
app.camera.registry[0].name=ESP32-CAM Front Door
app.camera.registry[0].host=web-cam.local
app.camera.registry[0].port=80

# ── Logging ──────────────────────────────────────────────────────────────────
# Application-level: shows all [RELAY] and [API] lines
logging.level.com.runtracer=DEBUG

# Spring MVC: shows route dispatch decisions
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# RestClient: shows outgoing HTTP calls to ESP32
logging.level.org.springframework.web.client=DEBUG

# Spring Security: shows filter-chain accept/reject decisions
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Include request parameters in Spring MVC debug output
spring.mvc.log-request-details=true

# Pattern: timestamp + thread + level + logger + message
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n